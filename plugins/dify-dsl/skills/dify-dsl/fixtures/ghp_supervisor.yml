kind: app
version: 0.6.0
app:
  mode: advanced-chat
  name: GHP遥感多智能体系统-编排循环版
  description: "Supervisor Loop: 编排器每轮调度一个Agent，循环执行直到完成"
  icon: "\U0001F6F0"
  icon_background: '#E4FBCC'
  icon_type: emoji
  use_icon_as_answer_icon: false
dependencies:
  - type: marketplace
    current_identifier: null
    value:
      marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.51@20a0511b3ac00ad81524ff7479b9f5e8bbd456e0590d4931b41c8dd82bee7192
      version: null
  - type: marketplace
    current_identifier: null
    value:
      marketplace_plugin_unique_identifier: langgenius/agent:0.0.37@a5dcc6ea00bca23439b49ff7d65704f3f5dd6ce2ca353205e62278e2148d84b6
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: [.jpg, .jpeg, .png, .gif, .webp, .svg]
      allowed_file_types: [image]
      allowed_file_upload_methods: [local_file, remote_url]
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image: { enabled: false, number_limits: 3, transfer_methods: [local_file, remote_url] }
      number_limits: 3
    opening_statement: "👋 你好！我是GHP遥感多智能体系统（编排循环版）。\n\n我可以帮你完成：\n📡 Landsat数据预处理\n🌡️ 地表温度反演\n🔥 热异常检测\n📊 分析报告生成\n\n请告诉我你的需求。"
    retriever_resource: { enabled: true }
    sensitive_word_avoidance: { enabled: false }
    speech_to_text: { enabled: false }
    suggested_questions:
      - 对指定目录下的Landsat数据执行全流程分析并出报告
      - 检测某区域煤火热异常
      - 扫描数据目录并分析数据情况
    suggested_questions_after_answer: { enabled: true }
    text_to_speech: { enabled: false, language: '', voice: '' }
  graph:
    nodes:
      # ── 1. 用户输入 ──
      - id: start
        type: custom
        data:
          title: "📥 用户输入"
          type: start
          variables: []
          selected: false
        height: 101
        width: 242
        position: { x: 0, y: 400 }
        positionAbsolute: { x: 0, y: 400 }
        sourcePosition: right
        targetPosition: left

      # ── 2. 知识检索 ──
      - id: knowledge
        type: custom
        data:
          title: "📚 知识检索"
          type: knowledge-retrieval
          selected: false
          dataset_ids:
            - 8BV9WG+yCKmvjWCXwhQEJPfGiRZBqcn3QcxoOsdmseo+deF1mI53TKL9nH2Wgmjk
          query_variable_selector: [start, sys.query]
          query_attachment_selector: []
          retrieval_mode: multiple
          multiple_retrieval_config:
            reranking_enable: true
            reranking_mode: reranking_model
            reranking_model:
              model: Qwen/Qwen3-Reranker-8B
              provider: langgenius/openai_api_compatible/openai_api_compatible
            top_k: 4
          single_retrieval_config:
            model:
              completion_params: { frequency_penalty: 0, max_tokens: 512, presence_penalty: 0, temperature: 0, top_p: 1 }
              mode: chat
              name: ds
              provider: langgenius/openai_api_compatible/openai_api_compatible
        height: 118
        width: 242
        position: { x: 342, y: 400 }
        positionAbsolute: { x: 342, y: 400 }
        sourcePosition: right
        targetPosition: left

      # ── 3. 主循环 Loop ──
      - id: main_loop
        type: custom
        data:
          title: "🔄 编排主循环"
          type: loop
          selected: false
          break_conditions:
            - variable_selector:
              - main_loop
              - is_done
              comparison_operator: ">"
              value: 0
              varType: number
          error_handle_mode: terminated
          height: 2200
          width: 2600
          logical_operator: and
          loop_count: 15
          loop_variables:
            - id: lv_is_done
              label: is_done
              var_type: number
              value_type: constant
              value: 0
            - id: lv_dp_output
              label: dp_output
              var_type: string
              value_type: constant
              value: ""
            - id: lv_ae_output
              label: ae_output
              var_type: string
              value_type: constant
              value: ""
            - id: lv_rw_output
              label: rw_output
              var_type: string
              value_type: constant
              value: ""
            - id: lv_review_output
              label: review_output
              var_type: string
              value_type: constant
              value: ""
            - id: lv_final_answer
              label: final_answer
              var_type: string
              value_type: constant
              value: ""
          start_node_id: main_loop_start
        height: 2200
        width: 2600
        position: { x: 684, y: 100 }
        positionAbsolute: { x: 684, y: 100 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1

      # ── 3a. 循环起点 ──
      - id: main_loop_start
        type: custom-loop-start
        parentId: main_loop
        data:
          title: ""
          type: loop-start
          isInLoop: true
          selected: false
        draggable: false
        height: 48
        width: 44
        position: { x: 730, y: 340 }
        positionAbsolute: { x: 730, y: 340 }
        selectable: false
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3b. 编排调度 Agent ──
      - id: agent_orchestrator
        type: custom
        parentId: main_loop
        data:
          title: "🎯 编排调度"
          type: agent
          selected: false
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          tool_node_version: '2'
          agent_strategy_label: ReAct
          agent_strategy_name: ReAct
          agent_strategy_provider_name: langgenius/agent/agent
          plugin_unique_identifier: langgenius/agent:0.0.37@a5dcc6ea00bca23439b49ff7d65704f3f5dd6ce2ca353205e62278e2148d84b6
          meta: { minimum_dify_version: 1.7.0, version: 0.0.2 }
          output_schema: {}
          agent_parameters:
            query:
              type: constant
              value: "{{#sys.query#}}"
            instruction:
              type: constant
              value: >-
                ## 身份

                你是遥感任务调度专家（Supervisor），负责在循环中调度各专业Agent的执行顺序。

                注意：你只负责任务调度和路由，不执行数据处理、分析、报告撰写或审查。

                ## 工具使用规范

                - scene_discovery: 扫描目录发现Landsat场景。首次调度时使用。
                  输入: action=discover_scenes, input_dir=目录路径
                - file_system: 浏览文件和目录结构。用于确认数据存在。
                  输入: action=list, directory=路径
                - artifact_query: 查询已有处理产物，避免重复工作。
                  输入: action=query, directory=路径

                ## 调度逻辑

                根据各Agent的输出状态决定下一步：

                | dp_output | ae_output | rw_output | review_output | 决策 |
                |-----------|-----------|-----------|---------------|------|
                | 空 | 空 | 空 | 空 | 首轮：用工具确认数据 → NEXT_AGENT: dp（或直接回答→done） |
                | 有 | 空 | 空 | 空 | NEXT_AGENT: ae |
                | 有 | 有 | 空 | 空 | NEXT_AGENT: rw |
                | 有 | 有 | 有 | 空 | NEXT_AGENT: review |
                | 有 | 有 | 有 | 不通过 | NEXT_AGENT: rw（修改报告） |
                | 有 | 有 | 有 | 通过 | NEXT_AGENT: done |

                特殊情况：
                - 用户只需简单查询（数据扫描、文件查询、问答）→ 直接回答，NEXT_AGENT: done
                - 数据不存在或目录无效 → 告知用户，NEXT_AGENT: done
                - 连续循环超过合理次数 → NEXT_AGENT: done（防止死循环）

                ## 输出格式（严格遵守）

                当调度Agent时：
                ```
                ## NEXT_AGENT: [dp|ae|rw|review|done]

                ## 调度指令
                [告诉下一个Agent需要做什么]

                ## 执行摘要
                [一句话总结当前进度]
                ```

                当 NEXT_AGENT: done 时，你必须提供用户可见的最终输出：
                - 如果有报告：输出完整报告 + 审查结论
                - 如果只是直接回答：输出你的回答
                - 不要输出内部调度过程

                ## 信息处理

                - 各Agent输出可能很长，仅关注：完成状态、关键结果摘要、是否出错、是否通过审查
                - 不要重复已完成的工作
                - 工具返回超过2000字时提取关键信息

                ## 错误处理

                - Agent输出为错误信息 → 决定重试（最多1次）或跳过
                - 数据问题无法继续 → NEXT_AGENT: done 并说明原因
                - 工具超时 → 重试一次，仍失败则 NEXT_AGENT: done

                ## 完成条件

                必须输出 NEXT_AGENT 标签。done 时提供完整最终输出。

                ## 操作记录

                每步输出: Thought → Action → Result

                ## 约束

                - 不要代替其他Agent执行任务
                - 每次只调度一个Agent
                - 必须先调用工具确认数据存在再调度dp
                - 用户未指定目录时，NEXT_AGENT: done 并询问路径


                用户请求: {{#sys.query#}}

                知识参考: {{#knowledge.result#}}

                --- 当前各Agent状态 ---

                数据处理: {{#main_loop.dp_output#}}

                分析结果: {{#main_loop.ae_output#}}

                报告: {{#main_loop.rw_output#}}

                审查: {{#main_loop.review_output#}}
            model:
              type: constant
              value:
                completion_params: { temperature: 0.1 }
                mode: chat
                model: ds
                model_type: llm
                provider: langgenius/openai_api_compatible/openai_api_compatible
                type: model-selector
            tools:
              type: constant
              value:
                - enabled: true
                  provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc
                  provider_show_name: 遥感工具
                  tool_name: scene_discovery
                  tool_label: scene_discovery
                  tool_description: "扫描目录发现Landsat场景、MTL元数据、波段文件、DEM"
                  type: api
                  extra: { description: "扫描目录发现Landsat场景、MTL元数据、波段文件、DEM" }
                  parameters:
                    action: { auto: 1, value: null }
                    input_dir: { auto: 1, value: null }
                  settings: {}
                - enabled: true
                  provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc
                  provider_show_name: 遥感工具
                  tool_name: file_system
                  tool_label: file_system
                  tool_description: "文件浏览、读取、资产盘点"
                  type: api
                  extra: { description: "文件浏览、读取、资产盘点" }
                  parameters:
                    action: { auto: 1, value: null }
                    directory: { auto: 1, value: null }
                    pattern: { auto: 1, value: null }
                    recursive: { auto: 1, value: null }
                  settings: {}
                - enabled: true
                  provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc
                  provider_show_name: 遥感工具
                  tool_name: artifact_query
                  tool_label: artifact_query
                  tool_description: "查询已处理的产出文件记录"
                  type: api
                  extra: { description: "查询已处理的产出文件记录" }
                  parameters:
                    action: { auto: 1, value: null }
                    directory: { auto: 1, value: null }
                    keyword: { auto: 1, value: null }
                  settings: {}
        height: 232
        width: 242
        position: { x: 800, y: 340 }
        positionAbsolute: { x: 800, y: 340 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3c. 路由: done? ──
      - id: if_route_1
        type: custom
        parentId: main_loop
        data:
          title: "🔀 done?"
          type: if-else
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          cases:
            - case_id: "done"
              logical_operator: and
              conditions:
                - variable_selector: [agent_orchestrator, text]
                  comparison_operator: contains
                  value: "NEXT_AGENT: done"
                  varType: string
        height: 126
        width: 242
        position: { x: 1100, y: 340 }
        positionAbsolute: { x: 1100, y: 340 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3d. 保存最终结果 ──
      - id: assigner_done
        type: custom
        parentId: main_loop
        data:
          title: "💾 保存结果"
          type: assigner
          version: "2"
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          items:
            - input_type: constant
              operation: over-write
              value: 1
              variable_selector:
              - main_loop
              - is_done
            - input_type: variable
              operation: over-write
              value:
              - agent_orchestrator
              - text
              variable_selector:
              - main_loop
              - final_answer
        height: 154
        width: 242
        position: { x: 1100, y: 200 }
        positionAbsolute: { x: 1100, y: 200 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3e. 路由: dp? ──
      - id: if_route_2
        type: custom
        parentId: main_loop
        data:
          title: "🔀 dp?"
          type: if-else
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          cases:
            - case_id: "dp"
              logical_operator: and
              conditions:
                - variable_selector: [agent_orchestrator, text]
                  comparison_operator: contains
                  value: "NEXT_AGENT: dp"
                  varType: string
        height: 126
        width: 242
        position: { x: 1100, y: 650 }
        positionAbsolute: { x: 1100, y: 650 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3f. 数据处理 Agent ──
      - id: agent_dp
        type: custom
        parentId: main_loop
        data:
          title: "💾 数据处理专家"
          type: agent
          selected: false
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          tool_node_version: '2'
          agent_strategy_label: ReAct
          agent_strategy_name: ReAct
          agent_strategy_provider_name: langgenius/agent/agent
          plugin_unique_identifier: langgenius/agent:0.0.37@a5dcc6ea00bca23439b49ff7d65704f3f5dd6ce2ca353205e62278e2148d84b6
          meta: { minimum_dify_version: 1.7.0, version: 0.0.2 }
          output_schema: {}
          agent_parameters:
            query:
              type: constant
              value: "{{#sys.query#}}"
            instruction:
              type: constant
              value: >-
                ## 身份

                你是遥感数据处理专家（DataProcessor），负责遥感数据的发现、验证和预处理。

                注意：你只负责数据预处理（辐射定标、大气校正、云掩膜），不负责分析、报告或审查。

                ## 工具使用规范

                - pretreatment_workflow: 一键预处理全流程（优先使用）
                  输入: directory=场景目录
                - scene_discovery: 发现场景和验证文件完整性
                - artifact_query: 查询已有产物避免重复处理
                - radiometric_calibration: 单独辐射定标（DN→TOA辐射率/反射率）
                - atmospheric_correction: 单独大气校正（Py6S模型）
                - cloud_mask: 单独云掩膜（QA_PIXEL解码）
                - file_system: 浏览和验证文件

                ## 执行流程（Step by Step）

                Step 1: 使用 artifact_query 检查是否已有预处理产物
                Step 2: 如已有完整产物 → 直接报告结果；否则使用 pretreatment_workflow 执行预处理
                Step 3: 如 pretreatment_workflow 不可用 → 按顺序单独调用: radiometric_calibration → atmospheric_correction → cloud_mask
                Step 4: 输出每个场景的处理状态和产物路径

                ## 输出格式

                ```
                ## 数据处理结果

                ### 场景: [场景名]
                - 预处理状态: 完成/跳过/失败
                - 产物路径: [列出所有输出文件]

                ### 总结
                - 处理场景数: X，成功: X，失败: X，跳过: X
                ```

                ## 信息处理

                - 工具返回超过2000字时，仅提取处理状态和产物路径
                - 忽略中间处理日志，只保留最终结果

                ## 错误处理

                - 文件不存在 → 跳过该场景，记录缺失项
                - 处理失败 → 检查输入参数重试一次 → 仍失败标记为失败并继续
                - MTL缺失 → 无法预处理，明确告知

                ## 完成条件

                输出必须包含：1) 每个场景的处理状态 2) 所有产物文件路径 3) 成功/失败统计

                ## 操作记录

                每步输出: Thought → Action → Result

                ## 约束

                - 处理前必须确认数据文件存在
                - 优先使用 pretreatment_workflow 批量处理
                - 不要编造文件路径，只使用工具实际返回的路径


                调度指令: {{#agent_orchestrator.text#}}

                用户请求: {{#sys.query#}}
            model:
              type: constant
              value:
                completion_params: { temperature: 0.1 }
                mode: chat
                model: ds
                model_type: llm
                provider: langgenius/openai_api_compatible/openai_api_compatible
                type: model-selector
            tools:
              type: constant
              value:
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: scene_discovery, tool_label: scene_discovery, tool_description: "发现Landsat场景、MTL元数据、波段文件", type: api, extra: { description: "发现Landsat场景、MTL元数据、波段文件" }, parameters: { action: { auto: 1, value: null }, input_dir: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: file_system, tool_label: file_system, tool_description: "文件浏览、读取、资产盘点", type: api, extra: { description: "文件浏览、读取、资产盘点" }, parameters: { action: { auto: 1, value: null }, directory: { auto: 1, value: null }, pattern: { auto: 1, value: null }, recursive: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: artifact_query, tool_label: artifact_query, tool_description: "查询已处理的产出文件记录", type: api, extra: { description: "查询已处理的产出文件记录" }, parameters: { action: { auto: 1, value: null }, directory: { auto: 1, value: null }, keyword: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: radiometric_calibration, tool_label: radiometric_calibration, tool_description: "Landsat DN转TOA辐射率/反射率", type: api, extra: { description: "Landsat DN转TOA辐射率/反射率" }, parameters: { band_tif_path: { auto: 1, value: null }, mtl_txt_path: { auto: 1, value: null }, out_dir: { auto: 1, value: null }, outputs: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: atmospheric_correction, tool_label: atmospheric_correction, tool_description: "Py6S大气校正", type: api, extra: { description: "Py6S大气校正" }, parameters: { in_tif_path: { auto: 1, value: null }, input_type: { auto: 1, value: null }, landsat_mtl_path: { auto: 1, value: null }, out_tif_path: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: cloud_mask, tool_label: cloud_mask, tool_description: "QA_PIXEL云掩膜", type: api, extra: { description: "QA_PIXEL云掩膜" }, parameters: { out_dir: { auto: 1, value: null }, qa_tif_path: { auto: 1, value: null } }, settings: {} }
                - { enabled: true, provider_name: 9133f347-7e06-46d5-869c-7a8ec10260dc, provider_show_name: 遥感工具, tool_name: pretreatment_workflow, tool_label: pretreatment_workflow, tool_description: "一键预处理全流程", type: api, extra: { description: "一键预处理全流程" }, parameters: { directory: { auto: 1, value: null }, skip_atmosphere: { auto: 1, value: null }, skip_calibration: { auto: 1, value: null } }, settings: {} }
        height: 216
        width: 242
        position: { x: 1400, y: 650 }
        positionAbsolute: { x: 1400, y: 650 }
        sourcePosition: right
        targetPosition: left
        zIndex: 1002

      # ── 3g. 保存dp结果 ──
      - id: assigner_dp
        type: custom
        parentId: main_loop
        data:
          title: "💾 保存dp"
          type: assigner
          version: "2"
          isInIteration: false
          isInLoop: true
          loop_id: main_loop
          items:
            - input_type: variable
