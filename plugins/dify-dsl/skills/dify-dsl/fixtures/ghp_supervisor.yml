                - 异常像元数: X，异常面积: X km² (占比 X%)

                ### 时序分析（如适用）
                - 叠加场景数: X，持续异常: X km²

                ### 产物路径
                [列出所有输出文件]
                ```

                ## 信息处理

                - 中间计算结果仅保留统计摘要
                - 工具返回超过2000字时提取关键数值（异常数、面积百分比）

